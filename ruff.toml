# ruff for the whole repo (TARGET-ARCHITECTURE.md "Tooling", OVERHAUL-PLAN.md D10).
# The strict rule set applies to every file. Legacy files are exempt only from what they break today, through the
# per-file ignores and the format exclude list below. Both lists only shrink: tools/ci/legacy_lint.py fails CI when
# an entry is no longer needed. No repo-wide reformat.
line-length = 120
target-version = "py312"
extend-exclude = ["third_party"]
force-exclude = true
include = ["*.py", "*.pyi"]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N"]

# Legacy files: the codes each one breaks today (2026-10-21). Only shrinks.
