[project]
name = "bg3ai-bridge"
version = "0.1.0"
description = "MCP server that lets an AI agent see and play Baldur's Gate 3 through the BG3AI mod"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=10",
]

[project.scripts]
bg3ai-mcp = "bg3ai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bg3ai"]
