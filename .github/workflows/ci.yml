# CI (TARGET-ARCHITECTURE.md "CI pipeline"). No job needs the game, a GPU, Steam or an API key.
# Report mode until Phase D (OVERHAUL-PLAN.md): import-linter and the boundary test print violations without failing.
# To enforce both, set enforce-boundaries = true under [tool.bg3ci] in pyproject.toml (tools/ci/import_contracts.py).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A pull request cancels its older run. A branch push doesn't: the running run finishes and only the newest waiting
# one starts after it, so busy branches (overhaul) still get complete runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.14"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: Legacy lint lists only shrink
        run: uv run python tools/ci/legacy_lint.py
      - name: pyright
        run: uv run pyright
      - name: import-linter (report mode)
        run: uv run python tools/ci/import_contracts.py
      - name: Package boundaries (report mode)
        run: uv run python tools/ci/test_boundaries.py
      - name: 1000-line cap
        run: uv run python tools/ci/line_cap.py

  test:
    name: pytest (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: pytest -m "not live and not e2e"
        run: uv run pytest -m "not live and not e2e" --cov --cov-report=
      - name: Coverage per package, with the floors of pyproject [tool.bg3ci.coverage-min]
        run: uv run python tools/ci/coverage_gate.py

  e2e:
    name: e2e (web app in Playwright, bench offline pipeline)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/playthrough/web/package-lock.json
            tools/pi/package-lock.json
      - run: uv sync --locked
      - name: Build the web app
        working-directory: packages/playthrough/web
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Install pi (the bench e2e runs it)
        working-directory: tools/pi
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Playwright version
        id: pw
        run: echo "version=$(uv run python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium
      - name: Install chromium's system libraries and ffmpeg (the recorder test encodes with libx264)
        run: |
          uv run playwright install-deps chromium
          command -v ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg
      - name: pytest -m e2e
        run: uv run pytest -m "e2e and not live"

  lua:
    name: Lua suites (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Pull the Lua images
        run: docker pull -q nickblah/lua:5.3 && docker pull -q nickblah/lua:5.4
      - name: Run the suites
        run: bash tools/ci/lua_suites.sh

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Find TypeScript packages
        id: find
        run: |
          dirs=$( (find packages tools -name package.json -not -path '*/node_modules/*' -printf '%h\n' 2>/dev/null || true) | sort | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          [ -n "$dirs" ] || echo "no package.json under packages/ or tools/: nothing to check"
      - uses: actions/setup-node@v4
        if: steps.find.outputs.dirs != ''
        with:
          node-version: 22
      - name: npm ci, tsc --noEmit, check, lint, vitest
        if: steps.find.outputs.dirs != ''
        # --ignore-scripts: no install hooks (tools/pi/README.md); `check` is svelte-check where a package has it
        run: |
          fail=0
          for d in ${{ steps.find.outputs.dirs }}; do
            echo "::group::$d"
            if (cd "$d" && npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit \
                && npm run --if-present check && npm run --if-present lint && npm run --if-present test); then
              echo "::endgroup::"
            else
              echo "::endgroup::"; echo "::error::$d failed"; fail=1
            fi
          done
          exit $fail
