# The stress-test matrix (docs/OVERHAUL-PLAN.md Phase F) as data: every BG3 situation group x act, the start save
# that reaches it, the checks that prove the harness works there and the 2026-10-21 baseline. Imported 2026-10-22
# from the live worker's research/ovh/STRESS-TEST.md; this file is now the source. tools/stress/run.py runs it and
# renders docs/STRESS-TEST.md from it and runtime/stress/results.json.
#
# [[group]]: key, title, rows (one inline table per line). A row: id, situation, act (P, 1, 2, 3 or any), save
# (the label after `Claude-<id>__` in the Story save folder; "" = a new game), alt_saves (other saves that reach
# it), save_note, check (a list), baseline (the 2026-10-21 result text). A row passes when all its checks do.
# Check kinds:
#   acc     section + item: an item of tools/dev/acceptance.py (the item name starts with `item`); run through
#           tools/dev/live_window.py, which loads the section's own saves (only loaded, never written)
#   probe   script (repo path) + args: run against the game started on a COPY of the row's save; its last
#           `STRESS <VERDICT> <evidence>` line is the verdict, else exit 0 = REVIEW (read the log), else FAIL.
#           ready = false + why: not runnable unattended yet (SKIP)
#   agent   where + objective (the start note), goal (a bg3bench predicate over facts.jsonl; none = REVIEW),
#           until (a milestone, default game_end: the session ends at its cap), minutes, profile, max_cost:
#           runner/play.py run on a scenario resolved from the row, started on a COPY of the row's save
#   manual  what: done by a person; record it with run.py --record ID#N VERDICT EVIDENCE

[defaults]
profile = "profiles/opus-5.5-claude-code.toml"  # Claude Code: the subscription, no --max-cost
max_cost = 1.0         # USD per agent session on a paid profile (client other than claude)
minutes = 20           # agent session cap
character_brief = "The save's own character, leading the party; plays as the player would."
min_free_gb = 4.0      # RAM guard: MemAvailable before each step
max_cpu_c = 90         # thermal guard: the hottest CPU sensor before each step
guard_wait_s = 900     # wait this long for the guards, then stop (resume later)
guard_poll_s = 30

[[group]]
key = "lifecycle"
title = "Game lifecycle"
rows = [
  {id = "G1", situation = "new game + character creation (one class)", act = "P", save = "", check = [{kind = "acc", section = "setup", item = "create_character: 1 attempt, time"}], baseline = "FAIL acc 2026-10-21 (create_character: 1 attempt, time (last =FAIL)"},
  {id = "G2", situation = "character creation, every class (12)", act = "P", save = "", check = [{kind = "agent", where = "Main menu, no save loaded.", objective = "Start a new game and create a character of a class not played before, then reach the Nautiloid.", goal = {region = "nautiloid"}, minutes = 20}]},
  {id = "G3", situation = "load a save, verified (new Lua state, party, game screen)", act = "2", save = "S027-start", check = [{kind = "acc", section = "se", item = "load_game game-process check"}], baseline = "PASS acc 2026-10-21 (load_game game-process check=PASS)"},
  {id = "G4", situation = "crash guard: 3 reloads in a row", act = "2", save = "S027-start", check = [{kind = "acc", section = "loads", item = "crash guard (3 reloads)"}], baseline = "PASS acc 2026-10-21 (crash guard (3 reloads)=PASS)"},
  {id = "G5", situation = "save (our name in the save box)", act = "2", save = "S027-start", check = [{kind = "acc", section = "se", item = "save name box reads our name"}], baseline = "PASS acc 2026-10-21 (save name box reads our name (probe, no =PASS)"},
  {id = "G6", situation = "quick save / quick load (F5/F8)", act = "1", save = "S013-start", check = [{kind = "acc", section = "se", item = "ui_action / press_key / ui.command don't save or load (UI-3)"}, {kind = "manual", what = "press F5 (quick save) and F8 (quick load) by hand; the agent's press_key/ui_action must refuse both"}], baseline = "PASS acc 2026-10-21 (UI-3 item only: ui_action/press_key don't save or load); F5/F8 not tried"},
  {id = "G7", situation = "game over screen → reload", act = "2", save = "S025-pre-karniss", save_note = "curse kills an un-shielded member", check = [{kind = "agent", where = "Shadow-Cursed Lands, near the inn's protection; one party member is not shielded from the curse.", objective = "Travel through the curse; if the game over screen appears, reload and carry on.", minutes = 20}]},
  {id = "G8", situation = "game over screen in the final fight", act = "3", save = "S095-psyche", check = [{kind = "agent", where = "The final fight against the Netherbrain.", objective = "Fight on; if the game over screen appears, reload and try again.", minutes = 30}]},
  {id = "G9", situation = "crash / OOM recovery (game killed mid-session, runner relaunches)", act = "2", save = "S027-start", check = [{kind = "acc", section = "setup", item = "ramwatch anon+swap kill signal"}, {kind = "manual", what = "kill -9 the game under a running runner session; the runner records the crash and relaunches"}], baseline = "PASS acc 2026-10-21 (ramwatch anon+swap kill signal=PASS)"},
  {id = "G10", situation = "game restart, mod hot reload", act = "any", save = "S027-start", check = [{kind = "manual", what = "python3 tools/dev/live_window.py --attach --reload on a running harness game: the mod reloads, checks true"}]},
  {id = "G11", situation = "display / Xwayland loss", act = "any", save = "S027-start", check = [{kind = "manual", what = "stop Xwayland (or unset DISPLAY) under a running session; runner/display_env recovers or says why"}]},
  {id = "G12", situation = "long session, memory growth (2 h)", act = "3", save = "S047-start-lowercity", check = [{kind = "agent", where = "Lower City, Baldur's Gate.", objective = "Explore the Lower City and follow the open quests.", minutes = 120}]},
  {id = "G13", situation = "bg3le strict frame lock across loads + long rest", act = "3", save = "S065-end", check = [{kind = "acc", section = "se", item = "bg3le strict frame lock (UI-5"}, {kind = "acc", section = "strict", item = "strict frame lock across loads + rest"}], baseline = "FAIL acc 2026-10-21 (se: bg3le strict frame lock UI-5=PASS; strict: across loads + rest S17=FAIL, camp refused 'cannot travel right now')"},
  {id = "G14", situation = "load screen / loading between regions (fast travel Act 2 → camp)", act = "2", save = "S027-start", check = [{kind = "acc", section = "rest", item = "fast_travel + camp leave"}], baseline = "PASS acc 2026-10-21 (fast_travel + camp leave (night camp)=PASS)"},
]

