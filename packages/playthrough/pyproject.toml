[project]
name = "bg3play"
version = "0.1.0"
description = "The BG3 playthrough app: config, run store, HTTP/SSE API and the web UI"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bg3play-serve = "bg3play.server:main"

[dependency-groups]
dev = ["pytest>=8", "playwright==1.64.0"]  # playwright: tests/e2e; 1.64.0 = the cached chromium 1243

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bg3play"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration", "e2e: browser tests of the built web app (npm run build first; -m e2e)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 120
