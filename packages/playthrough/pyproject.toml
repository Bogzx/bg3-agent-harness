[project]
name = "bg3play"
version = "0.1.0"
description = "The BG3 playthrough app: config, run store, HTTP/SSE API and the web UI"
requires-python = ">=3.12"
dependencies = [
    "bg3-agent-harness",  # run_session, the clients, client profiles, the events reader, the keeper's clients, ramwatch
    "bg3ai-bridge",  # metrics/progress/milestones (live views, keeper), render (snapshots), game/screen (bridge_status)
]

[project.scripts]
bg3play-serve = "bg3play.server:main"

[project.entry-points."bg3ai.memory"]
bg3play = "bg3play.memory.bridge_backend"  # the memory tools' backend (bg3ai.memtools.MemoryBackend)

[dependency-groups]
dev = ["pytest>=8", "playwright==1.64.0", "jsonschema>=4.20"]  # playwright: tests/e2e; 1.64.0 = the cached chromium 1243

[tool.uv.sources]
bg3-agent-harness = { workspace = true }
bg3ai-bridge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bg3play"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration", "e2e: browser tests of the built web app (npm run build first; -m e2e)"]
addopts = "-m 'not e2e'"
