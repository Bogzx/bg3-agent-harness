# A small but diverse run (user, 2026-10-25): 4 clients x 6 scenarios x 1 run, condition rules, no holdout, to see
# how models of different sizes and one cheap paid model do across the families and the acts before any wider series.
# research/ovh/pilot-runbook.md has the commands; run the matrix with CLAUDE_CONFIG_DIR=~/.claude-2 (account 2).
#
# Clients (job order: the models' order below, then the scenarios', in one repeat):
#   Claude Code, account 2's subscription (no USD cost), effort medium: Opus 5.5 (verified), Sonnet 5.5 and Haiku 5.5
#   (both "offline": never played live, hence allow_unverified); DeepSeek V4.1 Flash through pi (DeepSeek's API).
#   Opus' jobs come first and double as the check of the start saves.
# Scenarios (family, act, cap):
#   crash_site_grove      exploration  Act 1  1.0 h   reach the Emerald Grove
#   act1_gold_max         sandbox      Act 1  0.75 h  as much party gold as possible (maximise: no pass, score = gain)
#   act3_gold_max         sandbox      Act 3  0.75 h  the same in the Lower City (start save made live B1, bench-v0.8)
#   act1_level_3          sandbox      Act 1  1.0 h   every party member to level 3 (the level-up UI)
#   fight_act1_windmill   fight        Act 1  1.0 h   the windmill ambush
#   fight_act2_balthazar  fight        Act 2  1.5 h   a boss
# Condition: rules only. allow_gaps: play.py can't play rules-only exactly yet, so these runs are labelled as a pilot
# and never published.
#
# Cost bound, DeepSeek (the only paid client): $0.35 per run (each run's cap and the matrix's reserve), 6 paid runs,
# $2.10 at most. runtime/budget.json's cap must allow it.
# Time bound: the caps sum to 6.0 h per client, 24 h for all 24 runs if none ends early. The two gold runs always
# play their whole 45 min (maximise); a goal run may end sooner. The 18 Claude Code runs (up to 18 h) spend account
# 2's weekly limit.
name = "diverse-2026-10-25"
allow_gaps = true
allow_unverified = true

[[group]]
models = [
  "profiles/opus-5.5-claude-code.toml",
  "profiles/sonnet-5.5-claude-code.toml",
  "profiles/haiku-5.5-claude-code.toml",
  "profiles/deepseek-flash.toml",
]
scenarios = [
  "crash_site_grove", "act1_gold_max", "act3_gold_max", "act1_level_3", "fight_act1_windmill", "fight_act2_balthazar",
]
conditions = ["rules"]
repeats = 1

[budget]
max_cost = { crash_site_grove = 0.35, act1_gold_max = 0.35, act3_gold_max = 0.35, act1_level_3 = 0.35, fight_act1_windmill = 0.35, fight_act2_balthazar = 0.35 }
