# Launch campaign v1, Claude Haiku 5.5 through pi and the Anthropic API (12 scenarios x 3 runs = 36 runs).
# Scenario set (12, condition rules, 3 runs each):
#   scored (pass/fail, in the suite score): crash_site_grove (exploration), act1_goblin_camp_no_fight, act1_gold_1000,
#     act1_level_3 (sandbox), fight_act1_grove_gate, fight_act1_windmill, fight_act2_balthazar, fight_act2_moonrise_assault
#   not scored: choice_act1_karlach, choice_act1_minthara, choice_act2_nightsong (choice: no right answer),
#     act3_gold_max (maximise: a gain, no pass)
# max_cost: each scenario's time cap x $0.056 per minute (the estimate before the pilot) x 1.25, kept: a run it ends
# is scored over_budget, and it is only what the budget holds back while that run plays.
# Per minute measured: $0.0117 (launch-v1-pilot, 2026-10-29: windmill 12.0 min, $0.14, 99% cache reads), so the caps
# sit 4.7x above it. Estimate $9 for the 36 runs (771 play minutes: earlier pilots' play times, never-played
# scenarios assumed), $21 if every run played its whole cap (1755 min).
name = "launch-v1-haiku"
allow_gaps = false
allow_unverified = false

models = ["profiles/claude-haiku-5-5.toml"]
scenarios = [
  "crash_site_grove",
  "act1_goblin_camp_no_fight",
  "act1_gold_1000",
  "act1_level_3",
  "fight_act1_grove_gate",
  "fight_act1_windmill",
  "fight_act2_balthazar",
  "fight_act2_moonrise_assault",
  "choice_act1_karlach",
  "choice_act1_minthara",
  "choice_act2_nightsong",
  "act3_gold_max",
]
conditions = ["rules"]
repeats = 3

[budget]
# Its own share (cap $35 in runtime/budget-haiku.json: Haiku 35 + Sonnet 65 + Opus 70 = 170) and the shared Anthropic
# budget (runtime/budget-anthropic.json, cap 175, which holds the pilot's and earlier spend): a job starts only if
# its max_cost fits both, and its cost goes into both.
file = "runtime/budget-haiku.json"
shared = ["runtime/budget-anthropic.json"]

[budget.max_cost]
crash_site_grove = 4.21
act1_goblin_camp_no_fight = 3.16
act1_gold_1000 = 3.16
act1_level_3 = 4.21
fight_act1_grove_gate = 2.11
fight_act1_windmill = 4.21
fight_act2_balthazar = 6.31
fight_act2_moonrise_assault = 4.21
choice_act1_karlach = 2.11
choice_act1_minthara = 2.11
choice_act2_nightsong = 2.11
act3_gold_max = 3.16
