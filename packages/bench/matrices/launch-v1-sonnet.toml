# Launch campaign v1, Claude Sonnet 5.5 through pi and the Anthropic API (12 scenarios x 3 runs = 36 runs).
# Scenario set (12, condition rules, 3 runs each):
#   scored (pass/fail, in the suite score): crash_site_grove (exploration), act1_goblin_camp_no_fight, act1_gold_1000,
#     act1_level_3 (sandbox), fight_act1_grove_gate, fight_act1_windmill, fight_act2_balthazar, fight_act2_moonrise_assault
#   not scored: choice_act1_karlach, choice_act1_minthara, choice_act2_nightsong (choice: no right answer),
#     act3_gold_max (maximise: a gain, no pass)
# max_cost: each scenario's time cap x $0.10 per minute (the estimate before the pilot) x 1.25, kept: a run it ends
# is scored over_budget, and it is only what the budget holds back while that run plays.
# Per minute measured: $0.067 (launch-v1-pilot, 2026-10-29: windmill 7.3 min, $0.49, 98% cache reads), so the caps
# sit 1.9x above it. Estimate $49 for the 36 runs (732 play minutes: earlier pilots' play times, never-played
# scenarios assumed), $118 if every run played its whole cap (1755 min).
name = "launch-v1-sonnet"
allow_gaps = false
allow_unverified = false

models = ["profiles/claude-sonnet-5-5.toml"]
scenarios = [
  "crash_site_grove",
  "act1_goblin_camp_no_fight",
  "act1_gold_1000",
  "act1_level_3",
  "fight_act1_grove_gate",
  "fight_act1_windmill",
  "fight_act2_balthazar",
  "fight_act2_moonrise_assault",
  "choice_act1_karlach",
  "choice_act1_minthara",
  "choice_act2_nightsong",
  "act3_gold_max",
]
conditions = ["rules"]
repeats = 3

[budget]
# Its own share (cap $65 in runtime/budget-sonnet.json: Haiku 35 + Sonnet 65 + Opus 70 = 170) and the shared Anthropic
# budget (runtime/budget-anthropic.json, cap 175, which holds the pilot's and earlier spend): a job starts only if
# its max_cost fits both, and its cost goes into both.
file = "runtime/budget-sonnet.json"
shared = ["runtime/budget-anthropic.json"]

[budget.max_cost]
crash_site_grove = 7.56
act1_goblin_camp_no_fight = 5.67
act1_gold_1000 = 5.67
act1_level_3 = 7.56
fight_act1_grove_gate = 3.78
fight_act1_windmill = 7.56
fight_act2_balthazar = 11.34
fight_act2_moonrise_assault = 7.56
choice_act1_karlach = 3.78
choice_act1_minthara = 3.78
choice_act2_nightsong = 3.78
act3_gold_max = 5.67
