# Launch campaign v1, DeepSeek V4.1 Flash through pi and DeepSeek's API: the 8 scored scenarios x 3 runs = 24 runs
# (crash_site_grove, act1_goblin_camp_no_fight, act1_gold_1000, act1_level_3, fight_act1_grove_gate,
# fight_act1_windmill, fight_act2_balthazar, fight_act2_moonrise_assault).
# max_cost: each scenario's time cap x $0.0123 per minute (pilot diverse-2026-10-25, doubled for peak-hour prices)
# x 1.25. Estimate $3.60 off-peak, $7.30 at peak prices, $17 if every run played its whole cap at peak.
name = "launch-v1-deepseek"
allow_gaps = false
allow_unverified = false

models = ["profiles/deepseek-flash.toml"]
scenarios = [
  "crash_site_grove",
  "act1_goblin_camp_no_fight",
  "act1_gold_1000",
  "act1_level_3",
  "fight_act1_grove_gate",
  "fight_act1_windmill",
  "fight_act2_balthazar",
  "fight_act2_moonrise_assault",
]
conditions = ["rules"]
repeats = 3

[budget]
file = "runtime/budget-deepseek.json"

[budget.max_cost]
crash_site_grove = 0.92
act1_goblin_camp_no_fight = 0.69
act1_gold_1000 = 0.69
act1_level_3 = 0.92
fight_act1_grove_gate = 0.46
fight_act1_windmill = 0.92
fight_act2_balthazar = 1.38
fight_act2_moonrise_assault = 0.92
