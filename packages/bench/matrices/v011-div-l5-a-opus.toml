# bench-v0.11 L5 division tournament (owner 2026-11-10, D500; docs/ARENA-RESULTS.md amendment), division A, Opus's 3 pairs (Opus placed in A).
# Each pair to 15 pairings at L5: placement (the v011-rr-l5 file, repeat 1, the arena's seed) is the first, so this
# file plays repeats 2-15 (first_repeat = 2, repeats = 14: seeds + 1 .. + 14, no placement dice replayed).
# Repeat-major: every pair's next pairing before any later one, so a stop leaves even pairs.
# 84 matches, about 13.3 h at L5's measured 9.5 min a match. Expected $86.30 from
# the L5 placement's measured mean side costs (2026-11-10 14:10). Side caps as the placement files'.
# Own file cap: expected x 1.5 + the dearest match's two reserves = 144.9.
# An invalid match is rerun, at most 2 times; one ending at its cap is not.
name = "v011-div-l5-a-opus"
pairs = [
  ["profiles/claude-opus-5-5.toml", "profiles/gpt-6.1-sol-pi.toml"],
  ["profiles/claude-opus-5-5.toml", "profiles/gpt-6-astra-pi.toml"],
  ["profiles/claude-opus-5-5.toml", "profiles/deepseek-flash.toml"],
]
arenas = ["builds-l5-4v4-v1"]
repeats = 14
first_repeat = 2
allow_unverified = true

[budget]
file = "runtime/budget-v011-div-l5-a-opus.json"
max_cost = { "builds-l5-4v4-v1" = 13.92 }

[budget.models]
"profiles/claude-opus-5-5.toml" = ["../ovh-e2e/runtime/budget-opus.json", "../ovh-e2e/runtime/budget-anthropic.json"]
"profiles/gpt-6.1-sol-pi.toml" = ["runtime/budget-v011-sol.json"]
"profiles/gpt-6-astra-pi.toml" = ["runtime/budget-v011-night-codex.json"]
"profiles/deepseek-flash.toml" = ["../ovh-e2e/runtime/budget-deepseek.json"]

[budget.max_cost_models]
"profiles/claude-opus-5-5.toml" = 1.5
"profiles/gpt-6.1-sol-pi.toml" = 2.4
"profiles/gpt-6-astra-pi.toml" = 13.92
"profiles/deepseek-flash.toml" = 0.25
