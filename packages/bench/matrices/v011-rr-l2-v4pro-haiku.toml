# bench-v0.11 round robin, new models (orchestrator 2026-11-10 day round, owner: "You can start testing other modeks"):
# Claude Opus 5.5, DeepSeek V4 Pro and GPT-6 Sol each against the six of the night round robin, then each other.
# L2, pair 17 of 21 in the order of ops/logs/day-2026-11-10-pg-part3.md; one pair per file so pK picks pairs
# on a clean tree. Two matches, sides swapped. max_cost per side: the six as the night's L2 files; Opus, V4 Pro and
# GPT-6 Sol about 1.5-2x their high estimate (Sonnet's, DeepSeek flash's and GPT-6.1 Sol's measured L2 tokens at
# their own rates, peak DeepSeek rates), since none has played this arena. An invalid match is rerun, at most 2 times;
# one ending at its cap is not.
name = "v011-rr-l2-v4pro-haiku"
pairs = [["profiles/deepseek-v4-pro.toml", "profiles/claude-haiku-5-5.toml"]]
arenas = ["builds-l2-4v4-v1"]
repeats = 1
allow_unverified = true

[budget]
file = "runtime/budget-v011-rr-new-l2.json"
max_cost = { "builds-l2-4v4-v1" = 1.2 }

[budget.models]
"profiles/deepseek-v4-pro.toml" = ["../ovh-e2e/runtime/budget-deepseek.json"]
"profiles/claude-haiku-5-5.toml" = ["../ovh-e2e/runtime/budget-haiku.json", "../ovh-e2e/runtime/budget-anthropic.json"]

[budget.max_cost_models]
"profiles/deepseek-v4-pro.toml" = 1.2
"profiles/claude-haiku-5-5.toml" = 0.5
