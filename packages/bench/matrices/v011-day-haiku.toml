# bench-v0.11 at 3 runs per scenario (owner 2026-11-10: "make it 3 runs for the secnarios", Opus 2), claude-haiku-5-5. Played round by
# round (order "repeat": every scenario's next run before any scenario's run after it), shortest first, so the model is
# on the board early and a stop leaves even coverage. A valid run already counts for fight_act2_balthazar (v011-night/v011-sol-bench, accepted
# against bench-v0.11), so those get 2 more (each round after the
# scenarios with none) and the rest 3.
# max_cost: as v011-night-haiku (dearest recorded x 1.5, at least $0.50); act1_level_3 and crash_site_grove Haiku's dearest
# launch-v1 run x 1.5 ($4.22, $4.01).
# max_cost is the run's cap and its reserve. An invalid run is rerun, at most 2 times.
name = "v011-day-haiku"
allow_gaps = false
allow_unverified = false

[[group]]
models = ["profiles/claude-haiku-5-5.toml"]
scenarios = ["fight_act2_moonrise_assault", "fight_act1_windmill", "crash_site_grove", "act1_level_3", "act1_gold_max", "act3_gold_max"]
conditions = ["rules"]
repeats = 3

[[group]]
models = ["profiles/claude-haiku-5-5.toml"]
scenarios = ["fight_act2_balthazar"]
conditions = ["rules"]
repeats = 2

[budget]
file = "runtime/budget-v011-night-claude.json"
shared = ["../ovh-e2e/runtime/budget-haiku.json", "../ovh-e2e/runtime/budget-anthropic.json"]
max_cost = { fight_act2_balthazar = 0.5, fight_act2_moonrise_assault = 0.5, fight_act1_windmill = 1.83, crash_site_grove = 6.01, act1_level_3 = 6.34, act1_gold_max = 3.68, act3_gold_max = 3.68 }
