# bench-v0.11 day round (2026-11-10), Claude Opus 5.5 on the v0.11 playlist (owner: "and then also the opus on the
# scenarios"), after its L5 pairs. Shortest first by launch-v1's Opus wall minutes (balthazar 6.6, moonrise 8.8,
# crash_site_grove 31.9, act1_level_3 36.2 mean; the gold runs play their 45 min cap), so the most finish by the last
# start. fight_act1_windmill plays the new goal (Fezzerk's group): launch-v1's 7.4 min were the east goblin pack, and
# sol took 32 min on the new fight, so it goes after moonrise.
# max_cost: Opus's dearest launch-v1 run x 1.5 (balthazar $0.91, moonrise $1.73, crash_site_grove $10.27, act1_level_3
# $17.47); windmill moonrise's $2.60, since launch-v1's $1.19 was the shorter east-pack fight; the gold runs have no
# launch-v1 Opus record: the estimate's Opus high per gold run ($14.88, ops/logs/pilot-v011-estimate.md) x 1.5.
# max_cost is the run's cap and its reserve. An invalid run is rerun, at most 2 times.
name = "v011-day-opus"
order = "cell"
allow_gaps = false
allow_unverified = false
models = ["profiles/claude-opus-5-5.toml"]
scenarios = [
  "fight_act2_balthazar",
  "fight_act2_moonrise_assault",
  "fight_act1_windmill",
  "crash_site_grove",
  "act1_level_3",
  "act1_gold_max",
  "act3_gold_max",
]
conditions = ["rules"]
repeats = 1

[budget]
file = "runtime/budget-v011-day-opus.json"
shared = ["../ovh-e2e/runtime/budget-opus.json", "../ovh-e2e/runtime/budget-anthropic.json"]
max_cost = { fight_act2_balthazar = 1.37, fight_act2_moonrise_assault = 2.6, fight_act1_windmill = 2.6, crash_site_grove = 15.41, act1_level_3 = 26.21, act1_gold_max = 22.32, act3_gold_max = 22.32 }
