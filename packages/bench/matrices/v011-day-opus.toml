# bench-v0.11 at 3 runs per scenario (owner 2026-11-10: "make it 3 runs for the secnarios"), claude-opus-5-5. Played round by
# round (order "repeat": every scenario's next run before any scenario's run after it), shortest first, so the model is
# on the board early and a stop leaves even coverage. No v0.11 run of this model counts yet: 3 runs of each.
# max_cost: Opus's dearest launch-v1 run x 1.5 (balthazar $0.91, moonrise $1.73, crash_site_grove $10.27, act1_level_3 $17.47);
# windmill moonrise's $2.60 (launch-v1's $1.19 was the shorter east-pack fight); gold: the estimate's Opus high per gold
# run ($14.88, ops/logs/pilot-v011-estimate.md) x 1.5.
# max_cost is the run's cap and its reserve. An invalid run is rerun, at most 2 times.
name = "v011-day-opus"
allow_gaps = false
allow_unverified = false
models = ["profiles/claude-opus-5-5.toml"]
scenarios = [
  "fight_act2_balthazar",
  "fight_act2_moonrise_assault",
  "fight_act1_windmill",
  "crash_site_grove",
  "act1_level_3",
  "act1_gold_max",
  "act3_gold_max",
]
conditions = ["rules"]
repeats = 3

[budget]
file = "runtime/budget-v011-day-opus.json"
shared = ["../ovh-e2e/runtime/budget-opus.json", "../ovh-e2e/runtime/budget-anthropic.json"]
max_cost = { fight_act2_balthazar = 1.37, fight_act2_moonrise_assault = 2.6, fight_act1_windmill = 2.6, crash_site_grove = 15.41, act1_level_3 = 26.21, act1_gold_max = 22.32, act3_gold_max = 22.32 }
