# bench-v0.11 at 3 runs per scenario (owner 2026-11-10: "make it 3 runs for the secnarios", Opus 2), deepseek-flash. Played round by
# round (order "repeat": every scenario's next run before any scenario's run after it), shortest first, so the model is
# on the board early and a stop leaves even coverage. No v0.11 run of this model counts yet: 3 runs of each.
# max_cost: as the DeepSeek subset; act1_level_3 flash's dearest launch-v1 run x 1.5 ($0.43), crash_site_grove the $0.50 floor.
# max_cost (owner 2026-11-11: raise the caps so a normal run can't hit them; one rule for every model): the scenario's
# time cap (caps.run_hours) x 60 x the model's highest measured $/min x 1.5, rounded up to $0.10, never below the
# cap it had. deepseek-flash $0.0072/min (bench-v0.8, results-144);
# act1_gold_max and act3_gold_max keep $0.69.
# max_cost is the run's cap and its reserve. An invalid run is rerun, at most 2 times.
name = "v011-night-deepseek"
allow_gaps = false
allow_unverified = false
models = ["profiles/deepseek-flash.toml"]
scenarios = [
  "fight_act2_balthazar",
  "fight_act2_moonrise_assault",
  "fight_act1_windmill",
  "crash_site_grove",
  "act1_level_3",
  "act1_gold_max",
  "act3_gold_max",
]
conditions = ["rules"]
repeats = 3

[budget]
file = "runtime/budget-v011-night-deepseek.json"
shared = ["../ovh-e2e/runtime/budget-deepseek.json"]
max_cost = { fight_act2_balthazar = 1.0, fight_act2_moonrise_assault = 0.7, fight_act1_windmill = 0.7, crash_site_grove = 0.7, act1_level_3 = 0.7, act1_gold_max = 0.69, act3_gold_max = 0.69 }
