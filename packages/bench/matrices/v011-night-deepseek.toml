# bench-v0.11 night queue (owner 2026-11-09): group 3, DeepSeek flash, cheapest fight first. max_cost as the DeepSeek subset; ledger cap $3.
# max_cost is the run's cap and its reserve. An invalid run is rerun, at most 2 times.
name = "v011-night-deepseek"
order = "cell"
allow_gaps = false
allow_unverified = false
models = ["profiles/deepseek-flash.toml"]
scenarios = [
  "fight_act2_moonrise_assault",
  "fight_act2_balthazar",
  "fight_act1_windmill",
  "act1_gold_max",
  "act3_gold_max",
]
conditions = ["rules"]
repeats = 1

[budget]
file = "runtime/budget-v011-night-deepseek.json"
shared = ["../ovh-e2e/runtime/budget-deepseek.json"]
max_cost = { fight_act2_moonrise_assault = 0.5, fight_act2_balthazar = 0.5, fight_act1_windmill = 0.5, act1_gold_max = 0.69, act3_gold_max = 0.69 }
