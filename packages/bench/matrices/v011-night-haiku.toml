# bench-v0.11 night queue (owner 2026-11-09): group 1, Haiku, cheapest fight first. max_cost: dearest recorded cost x 1.5, at least $0.50. Charges its model file and budget-anthropic; no cap raised.
# max_cost is the run's cap and its reserve. An invalid run is rerun, at most 2 times.
name = "v011-night-haiku"
order = "cell"
allow_gaps = false
allow_unverified = false
models = ["profiles/claude-haiku-5-5.toml"]
scenarios = [
  "fight_act2_balthazar",
  "fight_act2_moonrise_assault",
  "fight_act1_windmill",
  "act1_gold_max",
  "act3_gold_max",
]
conditions = ["rules"]
repeats = 1

[budget]
file = "runtime/budget-v011-night-claude.json"
shared = ["../ovh-e2e/runtime/budget-haiku.json", "../ovh-e2e/runtime/budget-anthropic.json"]
max_cost = { fight_act2_balthazar = 0.5, fight_act2_moonrise_assault = 0.5, fight_act1_windmill = 1.83, act1_gold_max = 3.68, act3_gold_max = 3.68 }
