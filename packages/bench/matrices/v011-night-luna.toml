# bench-v0.11 at 3 runs per scenario (owner 2026-11-10: "make it 3 runs for the secnarios", Opus 2), gpt-6-luna-pi. Played round by
# round (order "repeat": every scenario's next run before any scenario's run after it), shortest first, so the model is
# on the board early and a stop leaves even coverage. No v0.11 run of this model counts yet: 3 runs of each.
# max_cost: as the night files (windmill from v011-night-luna-windmill, now folded in: the owner counts Codex credits as
# unlimited, so no gate); the 1 h runs act3_gold_max's $1.53 x 60/45. 1 ledger dollar is 25 credits.
# max_cost (owner 2026-11-11: raise the caps so a normal run can't hit them; one rule for every model): the scenario's
# time cap (caps.run_hours) x 60 x the model's highest measured $/min x 1.5, rounded up to $0.10, never below the
# cap it had. No Luna bench run is recorded yet: gpt-6.1-sol's $0.0479/min (v011-sol-bench
# act1_gold_max, $2.15 in 44.8 min), the other Codex model, stands in.
# max_cost is the run's cap and its reserve. An invalid run is rerun, at most 2 times.
name = "v011-night-luna"
allow_gaps = false
allow_unverified = true
models = ["profiles/gpt-6-luna-pi.toml"]
scenarios = [
  "fight_act2_balthazar",
  "fight_act2_moonrise_assault",
  "fight_act1_windmill",
  "crash_site_grove",
  "act1_level_3",
  "act1_gold_max",
  "act3_gold_max",
]
conditions = ["rules"]
repeats = 3

[budget]
file = "runtime/budget-v011-night-codex.json"
max_cost = { fight_act2_balthazar = 6.5, fight_act2_moonrise_assault = 4.4, fight_act1_windmill = 4.4, crash_site_grove = 4.4, act1_level_3 = 4.4, act1_gold_max = 3.3, act3_gold_max = 3.3 }
