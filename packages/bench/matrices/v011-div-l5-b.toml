# bench-v0.11 L5 division tournament (owner 2026-11-10, D500; docs/ARENA-RESULTS.md amendment), division B (Haiku, Sonnet, Luna): its 3 pairs.
# Each pair to 15 pairings at L5: placement (the v011-rr-l5 file, repeat 1, the arena's seed) is the first, so this
# file plays repeats 2-15 (first_repeat = 2, repeats = 14: seeds + 1 .. + 14, no placement dice replayed).
# Repeat-major: every pair's next pairing before any later one, so a stop leaves even pairs.
# 84 matches, about 13.3 h at L5's measured 9.5 min a match. Expected $12.82 from
# the L5 placement's measured mean side costs (2026-11-10 14:10). Side caps as the placement files'.
# Own file cap: expected x 1.5 + the dearest match's two reserves = 20.3.
# An invalid match is rerun, at most 2 times; one ending at its cap is not.
name = "v011-div-l5-b"
pairs = [
  ["profiles/claude-haiku-5-5.toml", "profiles/claude-sonnet-5-5.toml"],
  ["profiles/gpt-6-luna-pi.toml", "profiles/claude-haiku-5-5.toml"],
  ["profiles/gpt-6-luna-pi.toml", "profiles/claude-sonnet-5-5.toml"],
]
arenas = ["builds-l5-4v4-v1"]
repeats = 14
first_repeat = 2
allow_unverified = true

[budget]
file = "runtime/budget-v011-div-l5-b.json"
max_cost = { "builds-l5-4v4-v1" = 0.55 }

[budget.models]
"profiles/claude-sonnet-5-5.toml" = ["../ovh-e2e/runtime/budget-sonnet.json", "../ovh-e2e/runtime/budget-anthropic.json"]
"profiles/claude-haiku-5-5.toml" = ["../ovh-e2e/runtime/budget-haiku.json", "../ovh-e2e/runtime/budget-anthropic.json"]
"profiles/gpt-6-luna-pi.toml" = ["runtime/budget-v011-night-codex.json"]

[budget.max_cost_models]
"profiles/claude-sonnet-5-5.toml" = 0.55
"profiles/claude-haiku-5-5.toml" = 0.5
"profiles/gpt-6-luna-pi.toml" = 0.5
