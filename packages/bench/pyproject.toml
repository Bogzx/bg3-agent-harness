[project]
name = "bg3bench"
version = "0.9.0"
description = "The BG3 benchmark: graders over facts.jsonl, statistics, run manifests and results"
requires-python = ">=3.14"
# bg3-agent-harness: the LLM judge (bg3harness.judge, D4); jsonschema: the submission validator (panel and job)
dependencies = ["bg3-agent-harness", "jsonschema>=4.20"]

[project.scripts]
bg3bench-serve = "bg3bench.serve.server:main"  # the local panel

[project.optional-dependencies]
# Inspect AI .eval export (export_inspect.py). Pinned: Inspect moves event classes and the .eval layout between
# releases; bump the pin and rerun tests/test_export_inspect.py together.
inspect = ["inspect-ai==0.3.282"]
# The baseline agents speak MCP to the bg3 server (the bridge pins the same range).
baselines = ["mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "playwright==1.64.0"]  # playwright: tests/e2e (the panel), the pin bg3play uses
# Optional cross-check of the statistics against scipy; the tests skip it when scipy is absent.
crosscheck = ["scipy>=1.11"]

[tool.uv.sources]
bg3-agent-harness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bg3bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration", "e2e"]

[tool.ruff]
line-length = 120
target-version = "py312"  # the root ruff.toml's: requires-python 3.14 would make ruff rewrite to 3.14 syntax
