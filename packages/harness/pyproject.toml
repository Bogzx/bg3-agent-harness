[project]
name = "bg3-agent-harness"
version = "0.1.0"
description = "The BG3 agent harness: prompt assembly and the facts/events data contracts (more modules land here)"
requires-python = ">=3.12"
dependencies = []

# Every pytest run in the workspace venv gets a temp game profile first (bg3harness/testing/profile.py)
[project.entry-points.pytest11]
bg3harness-profile = "bg3harness.testing.pytest_profile"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bg3harness"]

[tool.pytest.ini_options]
testpaths = ["tests", "prompts/tests"]
