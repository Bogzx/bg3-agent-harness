<text x="24.0" y="448.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">(1) A rerun with the goal fixed to name the windmill goblins. The first run was graded a pass at 1.0 min for</text>
<text x="24.0" y="466.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">     killing a sleeping bugbear, because the goal then passed any won fight.</text>
<text x="24.0" y="484.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">(2) Stopped early by a limit of 6 resumes after the agent ended its turn (since removed for gold runs).</text>
<text x="24.0" y="502.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">(3) Recorded invalid over one move timeout counted as a harness failure; valid on a read-only re-grade.</text>
<text x="24.0" y="520.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">(4) The agent reloaded after the wipe and ended at +853; a wipe now ends the run, so the score is the gold at</text>
<text x="24.0" y="538.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">     the wipe.</text>
<text x="24.0" y="556.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Times are minutes of play. Claude Code ran on a subscription; at list price the counted runs would have cost</text>
<text x="24.0" y="574.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">$48.35 (Opus), $6.70 (Sonnet) and $2.57 (Haiku). DeepSeek's six runs billed $0.98 in all.</text>
