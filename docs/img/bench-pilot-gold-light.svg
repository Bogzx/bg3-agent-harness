<svg xmlns="http://www.w3.org/2000/svg" width="960" height="506" viewBox="0 0 960 506" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-label="Party gold over time in the pilot's gold scenarios">
<title>Party gold over time in the pilot's gold scenarios</title>
<rect x="0.5" y="0.5" width="959" height="505" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24.0" y="36.0" font-size="19" font-weight="650" fill="#0b0b0b" text-anchor="start">Party gold over time in the two gold scenarios</text>
<text x="24.0" y="58.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">One run per model, 45-minute cap. Score = gold at the end minus gold at the start. A line that stops</text>
<text x="24.0" y="76.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">early ended early: the party wiped, or the resume limit cut the run. Opus's Act 1 party wiped at 41.7 min</text>
<text x="24.0" y="94.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">and it reloaded (dashed); the score counts the gold at the wipe. Sonnet's drop to 0 in Act 1: its gold was</text>
<text x="24.0" y="112.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">confiscated on an arrest, then taken back.</text>
<rect x="24" y="124.0" width="912" height="26" rx="6" fill="#fdf0d5"/>
<text x="36.0" y="141.5" font-size="12.5" font-weight="600" fill="#6b4a00" text-anchor="start">PILOT: one run each, not a ranking. Rules condition with known gaps; the harness changed during the matrix.</text>
