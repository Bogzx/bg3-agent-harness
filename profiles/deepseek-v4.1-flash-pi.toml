# DeepSeek V4.1 Flash through pi and OpenRouter, pinned to DeepSeek's own endpoint.
# Example: model numbers and compat from pi 1.3.0's catalog (2026-10-21); check them before a series.
client = "pi"
model = "deepseek/deepseek-v4.1-flash"
effort = "high"

[endpoint]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[routing]
only = ["deepseek"]

[model_info]
input = ["text", "image"]
reasoning = true
context_window = 1048576
max_tokens = 32000
thinking_level_map = { off = "none", minimal = false, medium = false, xhigh = false }
compat = { requiresReasoningContentOnAssistantMessages = true }
cost = { input = 0.3, output = 1.2, cache_read = 0.006 }
