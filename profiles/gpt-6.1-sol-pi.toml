# GPT-6.1 Sol through pi's openai-codex-responses API, on the account's Codex credits. The token is the access token of
# the Codex CLI's login (~/.codex/auth.json), read only (client_setup.codex_token).
# Model numbers, thinking map, compat flags and rates from pi 1.3.0's catalog (pi-ai providers/data/openai-codex.json).
# The rates are USD per M tokens: the Codex rate card's credits are 25 x them (50 / 2.5 / 250 per M), so a ledger dollar
# is 25 credits. The over-272k tier is the catalog's; the rate card shows none, so past it the ledger counts more than
# the card would.
client = "pi"
model = "gpt-6.1-sol"
effort = "medium"  # served as medium: the catalog's thinkingLevelMap keeps it
status = "offline"  # never played live; v011-sol's matrices set allow_unverified

[endpoint]
provider = "openai-codex"
base_url = "https://chatgpt.com/backend-api"
api = "openai-codex-responses"
api_key_env = "BG3AI_CODEX_ACCESS_TOKEN"

[model_info]
input = ["text", "image"]
reasoning = true
context_window = 500000
max_tokens = 128000
thinking_level_map = { off = false, minimal = "low" }
compat = { supportsOpenAIGrammarTools = true, supportsAdditionalTools = true, supportsToolSearch = true, supportsMidConvoSystemMessages = true }

[model_info.cost]
input = 2
output = 10
cache_read = 0.1
cache_write = 2.5

[[model_info.cost.tiers]]
input_tokens_above = 272000
input = 4
output = 15
cache_read = 0.2
cache_write = 5
