# Claude Opus 5.5 through pi and OpenRouter's chat completions, pinned to Anthropic (the ranked track, D6).
# Example: model numbers from pi 1.3.0's catalog (2026-10-21); check them before a series.
client = "pi"
model = "anthropic/claude-opus-5.5"
effort = "medium"
status = "offline"  # offline checks only, never played live (bg3harness/profiles.py)

[endpoint]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[routing]
only = ["anthropic"]

[model_info]
input = ["text", "image"]
reasoning = true
context_window = 1000000
max_tokens = 32000
thinking_level_map = { off = false, minimal = false }
cost = { input = 4.0, output = 20.0, cache_read = 0.2, cache_write = 5.0 }
