# DeepSeek V4.1 Flash through pi and DeepSeek's own API (pi's deepseek provider id; no OpenRouter, so no [routing]).
# Example: model numbers from pi 1.3.0's catalog (2026-10-21); pi detects DeepSeek's compat from the provider id.
client = "pi"
model = "deepseek-flash"
effort = "high"

[endpoint]
provider = "deepseek"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[model_info]
input = ["text", "image"]
reasoning = true
context_window = 1000000
max_tokens = 32000
thinking_level_map = { minimal = false, medium = false }
cost = { input = 0.3, output = 1.2, cache_read = 0.006 }
