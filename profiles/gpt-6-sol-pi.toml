# GPT-6 Sol through pi's openai-codex-responses API, on the account's Codex credits; the token is the Codex CLI's
# login, read only. Model numbers, thinking map, compat flags and rates from pi 1.3.0's catalog. A ledger dollar is 25
# credits (the rate card is 25 x these rates). The over-272k tier is the catalog's.
client = "pi"
model = "gpt-6-sol"
effort = "medium"  # served as medium: the catalog's thinkingLevelMap keeps medium (C04)
status = "offline"  # never played live; the matrices that play it set allow_unverified

[endpoint]
provider = "openai-codex"
base_url = "https://chatgpt.com/backend-api"
api = "openai-codex-responses"
api_key_env = "BG3AI_CODEX_ACCESS_TOKEN"

[model_info]
input = ["text", "image"]
reasoning = true
context_window = 272000
max_tokens = 128000
thinking_level_map = { off = "none", minimal = "low" }
compat = { supportsOpenAIGrammarTools = true, supportsAdditionalTools = true, supportsToolSearch = true, supportsMidConvoSystemMessages = true }

[model_info.cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5

[[model_info.cost.tiers]]
input_tokens_above = 272000
input = 4
output = 15
cache_read = 0.4
cache_write = 5
