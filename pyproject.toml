# Virtual uv workspace root: no package of its own, one lock (uv.lock) for every member.
# Members: the MCP bridge (bg3ai) and the packages under packages/ (bg3harness, bg3bench, bg3play).
[tool.uv.workspace]
members = ["bridge", "packages/*"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "lz4>=4.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3",
    "ruff>=0.17.1",
    "zstandard>=0.22",
]

# One pytest run over every test directory; the unittest tests run under it unchanged (prepend import mode puts each
# test file's directory on sys.path, as `python -m unittest discover -s <dir>` does). CI runs `-m "not live"`.
[tool.pytest.ini_options]
testpaths = [
    "bridge/tests",
    "runner",
    "tools",
    "packages/*/tests",
    "packages/harness/prompts/tests",
]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# A test that hangs fails after 300 s with every thread's stack (the slowest today, runner/test_crash.py, take ~17 s),
# instead of the CI job timing out with no name (07794d7: the pytest job stopped in runner/test_crash.py for 26 min).
timeout = 300
timeout_method = "thread"
markers = [
    "unit: pure logic, no I/O beyond tmp dirs",
    "integration: one real component against fakes or recorded fixtures",
    "e2e: the whole offline pipeline (fake mod, scripted model)",
    "live: needs the real game, Steam or a paid model; never in CI",
]

# Coverage per package: tools/ci/coverage_gate.py prints the total of each entry of `source` and of
# [tool.bg3ci.coverage-min], and fails CI when a floored package is below its floor.
[tool.coverage.run]
branch = true
source = ["bridge/src/bg3ai", "runner", "tools", "packages"]
omit = ["*/test_*.py", "*/tests/*"]

[tool.coverage.report]
skip_empty = true
precision = 1

# Coverage floors (percent, line + branch) of the offline run, `pytest -m "not live and not e2e"`. Each is the
# measured value minus 1 (2026-10-22: bridge 88.3, harness 88.8, bench 99.8, playthrough 90.5). Ratchet only up.
[tool.bg3ci.coverage-min]
"bridge/src/bg3ai" = 87.3
"packages/harness" = 87.8
"packages/bench/src" = 98.8
"packages/playthrough/src" = 89.5

[tool.importlinter]
root_packages = ["bg3ai", "bg3harness", "bg3bench", "bg3play"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "harness imports neither bench nor app"
type = "forbidden"
source_modules = ["bg3harness", "bg3ai"]
forbidden_modules = ["bg3bench", "bg3play"]

[[tool.importlinter.contracts]]
name = "bench and app are independent"
type = "independence"
modules = ["bg3bench", "bg3play"]
